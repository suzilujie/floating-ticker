name: testflight

# TestFlight 上传流水线（付费开发者账号路径）
#
# 与 ios-build.yml 的分工：
#   ios-build.yml   → 产出「未签名 ipa」，供 Windows 侧 Sideloadly 侧载（免费账号兜底，保留）
#   testflight.yml  → 签名 + 上传 TestFlight，手机端远程安装与更新（不再需要数据线）
#
# 关键设计：**未配置密钥时整条流水线安全跳过**（既不报错也不把 CI 弄红）。
# 因此在账号与密钥就绪之前，本文件可以先合并进仓库，不影响任何现有流程；
# 密钥一旦填入 GitHub Secrets，下一次 push 就会自动打包上传。
#
# 需要的仓库 Secrets：
#   ASC_API_KEY_ID      App Store Connect API 密钥的 Key ID
#   ASC_API_ISSUER_ID   App Store Connect API 的 Issuer ID
#   ASC_API_KEY_P8      .p8 文件内容的 base64（Secrets 不适合直接存多行文本）
#   ASC_TEAM_ID         （可选）团队 ID，导出时用于明确签名团队
#
# 参见 docs/设计文档.html 第 14 章。

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  upload:
    name: Build, sign and upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      # 凭据检查放在最前面，且不依赖 checkout：
      # 后续所有步骤都以它的输出为条件，实现"没密钥就整体跳过"
      - name: Check credentials
        id: creds
        env:
          KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          if [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$KEY_P8" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=跳过 TestFlight 上传::未配置 ASC_API_KEY_ID / ASC_API_ISSUER_ID / ASC_API_KEY_P8；本次跳过上传，其余流程不受影响"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "密钥已配置，将执行签名并上传 TestFlight"
          fi

      - name: Checkout
        if: steps.creds.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Show toolchain versions
        if: steps.creds.outputs.configured == 'true'
        run: |
          xcodebuild -version
          sw_vers

      - name: Install XcodeGen
        if: steps.creds.outputs.configured == 'true'
        run: brew install xcodegen

      - name: Generate Xcode project
        if: steps.creds.outputs.configured == 'true'
        run: xcodegen generate

      # 与 ios-build.yml 一致：把提交号写进 App，界面可查"装的是哪一版"
      - name: Inject build info
        if: steps.creds.outputs.configured == 'true'
        run: |
          SHA=$(git rev-parse --short HEAD)
          BUILT_AT=$(date -u '+%Y-%m-%d %H:%M UTC')
          {
            echo 'import Foundation'
            echo ''
            echo 'enum BuildInfo {'
            echo "    static let commit = \"$SHA\""
            echo "    static let builtAt = \"$BUILT_AT\""
            echo '}'
          } > Sources/App/BuildInfo.swift
          cat Sources/App/BuildInfo.swift

      - name: Write App Store Connect API key
        if: steps.creds.outputs.configured == 'true'
        env:
          KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -e
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          # 用 openssl 而不是 base64 命令解码：macOS(BSD) 与 Linux(GNU) 的
          # base64 参数不同，openssl 两边一致；-A 要求单行，故先去掉换行与空格
          printf '%s' "$KEY_P8" | tr -d '\n\r ' | openssl base64 -d -A > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "已写入密钥：$KEY_PATH"
          head -n 1 "$KEY_PATH"

      - name: Archive (Release, automatic signing)
        if: steps.creds.outputs.configured == 'true'
        env:
          KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -e
          # 构建号用 GitHub 运行号自动递增：同一版本号重复上传会被 App Store Connect 直接拒收
          xcodebuild archive \
            -project FloatingTicker.xcodeproj \
            -scheme FloatingTicker \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/FloatingTicker.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            MARKETING_VERSION="0.1"

      - name: Export App Store ipa
        if: steps.creds.outputs.configured == 'true'
        env:
          KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          set -e
          # exportOptions 的 method 取值随 Xcode 版本变化：
          # Xcode 15+ 为 app-store-connect，更早的版本为 app-store
          XCODE_MAJOR=$(xcodebuild -version | head -n 1 | awk '{print $2}' | cut -d. -f1)
          if [ "$XCODE_MAJOR" -ge 15 ]; then
            METHOD=app-store-connect
          else
            METHOD=app-store
          fi
          echo "Xcode major=$XCODE_MAJOR，导出方式=$METHOD"

          # 用 plutil + PlistBuddy 生成 plist，避免 heredoc 写法把 XML 声明缩进坏掉
          plutil -create xml1 ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :method string $METHOD" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :signingStyle string automatic" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool true" ExportOptions.plist
          if [ -n "$TEAM_ID" ]; then
            /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" ExportOptions.plist
          fi
          echo "=== ExportOptions.plist ==="
          plutil -p ExportOptions.plist

          xcodebuild -exportArchive \
            -archivePath build/FloatingTicker.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

          echo "=== 导出产物 ==="
          ls -lh build/export

      - name: Upload to TestFlight
        if: steps.creds.outputs.configured == 'true'
        env:
          KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -e
          # altool 已被 Apple 标记为 deprecated，但仍是 CI 上传构建的常规手段。
          # 若某天 runner 上不再提供，改走 fastlane 的 upload_to_testflight（需要我调整本文件）。
          if ! xcrun --find altool > /dev/null 2>&1; then
            echo "::error::runner 上找不到 altool，需改用 fastlane 上传（请告知我调整 workflow）"
            exit 1
          fi
          xcrun altool --upload-app \
            --type ios \
            --file build/export/FloatingTicker.ipa \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID" \
            --verbose

      - name: Summary
        if: steps.creds.outputs.configured == 'true'
        run: |
          {
            echo "### TestFlight 上传完成"
            echo ""
            echo "- 提交：$(git rev-parse --short HEAD)"
            echo "- 版本：0.1（构建号 ${GITHUB_RUN_NUMBER}）"
            echo ""
            echo "构建在 App Store Connect 处理完成后（通常 5~30 分钟）会出现在 TestFlight 中。"
            echo "内部测试员（账号本人）无需审核，可直接安装。"
          } >> "$GITHUB_STEP_SUMMARY"
