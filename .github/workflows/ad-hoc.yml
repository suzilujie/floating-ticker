name: ad-hoc

# Ad Hoc 分发流水线（付费开发者账号路径）
#
# 产出：一个用 Ad Hoc 证书签名的 ipa + 供手机"点链接安装"的 manifest.plist，
#       并发布到 GitHub Pages，得到一条 HTTPS 安装链接。
#       手机 Safari 打开 itms-services:// 链接即可安装，无需数据线。
#
# 关键设计：**未配置密钥时整条流水线安全跳过**（不报错、不弄红 CI）。
#
# 需要的仓库 Secrets：
#   ASC_API_KEY_ID      App Store Connect API 密钥的 Key ID
#   ASC_API_ISSUER_ID   App Store Connect API 的 Issuer ID
#   ASC_API_KEY_P8      .p8 文件内容的 base64（Secrets 不适合直接存多行文本）
#   ASC_TEAM_ID         （可选）团队 ID
#
# 前置条件（用户侧，需先在 Apple 开发者后台完成）：
#   1. 把要安装的设备 UDID 注册进 Devices（Ad Hoc 的"白名单"）
#   2. 注册 App ID：com.xfish.floatingticker
#   3. 仓库 Settings → Pages 里启用 Pages（Source 选 gh-pages 分支根目录）
#
# 安装链接（构建成功后，在 Summary 里会打印）：
#   itms-services://?action=download-manifest&url=https://<owner>.github.io/<repo>/manifest.plist

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  distribute:
    name: Build and distribute Ad Hoc
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check credentials
        id: creds
        env:
          KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          if [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$KEY_P8" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=跳过 Ad Hoc 分发::未配置 ASC_API_KEY_ID / ASC_API_ISSUER_ID / ASC_API_KEY_P8；本次跳过，其余流程不受影响"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "密钥已配置，将执行 Ad Hoc 签名并发布"
          fi

      - name: Checkout
        if: steps.creds.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Show toolchain versions
        if: steps.creds.outputs.configured == 'true'
        run: |
          xcodebuild -version
          sw_vers

      - name: Install XcodeGen
        if: steps.creds.outputs.configured == 'true'
        run: brew install xcodegen

      - name: Generate Xcode project
        if: steps.creds.outputs.configured == 'true'
        run: xcodegen generate

      - name: Inject build info
        if: steps.creds.outputs.configured == 'true'
        run: |
          SHA=$(git rev-parse --short HEAD)
          BUILT_AT=$(date -u '+%Y-%m-%d %H:%M UTC')
          {
            echo 'import Foundation'
            echo ''
            echo 'enum BuildInfo {'
            echo "    static let commit = \"$SHA\""
            echo "    static let builtAt = \"$BUILT_AT\""
            echo '}'
          } > Sources/App/BuildInfo.swift
          cat Sources/App/BuildInfo.swift

      - name: Write App Store Connect API key
        if: steps.creds.outputs.configured == 'true'
        env:
          KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -e
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          printf '%s' "$KEY_P8" | tr -d '\n\r ' | openssl base64 -d -A > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "已写入密钥：$KEY_PATH"
          head -n 1 "$KEY_PATH"

      - name: Archive (Release, automatic signing)
        if: steps.creds.outputs.configured == 'true'
        env:
          KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -e
          # DEVELOPMENT_TEAM 已写进 project.yml（见该文件），此处无需重复指定
          xcodebuild archive \
            -project FloatingTicker.xcodeproj \
            -scheme FloatingTicker \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/FloatingTicker.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            MARKETING_VERSION="0.1"

      - name: Export Ad Hoc ipa
        if: steps.creds.outputs.configured == 'true'
        env:
          KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          set -e
          plutil -create xml1 ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :method string ad-hoc" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :signingStyle string automatic" ExportOptions.plist
          if [ -n "$TEAM_ID" ]; then
            /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" ExportOptions.plist
          fi
          echo "=== ExportOptions.plist ==="
          plutil -p ExportOptions.plist

          xcodebuild -exportArchive \
            -archivePath build/FloatingTicker.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

          echo "=== 导出产物 ==="
          ls -lh build/export

      - name: Prepare OTA files
        if: steps.creds.outputs.configured == 'true'
        run: |
          set -e
          mkdir -p ota
          # 固定文件名，确保 manifest 里的下载地址稳定
          cp build/export/FloatingTicker.ipa ota/FloatingTicker.ipa
          ls -lh ota/FloatingTicker.ipa

          REPO="${{ github.repository }}"
          OWNER="${REPO%%/*}"
          NAME="${REPO##*/}"
          BASE="https://${OWNER}.github.io/${NAME}/"

          cat > ota/manifest.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>items</key>
            <array>
              <dict>
                <key>assets</key>
                <array>
                  <dict>
                    <key>kind</key><string>software-package</string>
                    <key>url</key><string>${BASE}FloatingTicker.ipa</string>
                  </dict>
                </array>
                <key>metadata</key>
                <dict>
                  <key>bundle-identifier</key><string>com.xfish.floatingticker</string>
                  <key>bundle-version</key><string>0.1</string>
                  <key>kind</key><string>software</string>
                  <key>title</key><string>悬浮行情</string>
                </dict>
              </dict>
            </array>
          </dict>
          </plist>
          PLIST

          echo "BASE=$BASE"
          echo "manifest 内容："
          cat ota/manifest.plist

      - name: Publish to GitHub Pages
        if: steps.creds.outputs.configured == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ota
          publish_branch: gh-pages
          force_orphan: true

      - name: Upload ipa artifact
        if: steps.creds.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FloatingTicker-adhoc-ipa
          path: ota/FloatingTicker.ipa
          retention-days: 30

      - name: Summary
        if: steps.creds.outputs.configured == 'true'
        run: |
          REPO="${{ github.repository }}"
          OWNER="${REPO%%/*}"
          NAME="${REPO##*/}"
          BASE="https://${OWNER}.github.io/${NAME}/"
          {
            echo "### Ad Hoc 分发完成"
            echo ""
            echo "- 提交：$(git rev-parse --short HEAD)"
            echo "- 版本：0.1（构建号 ${{ github.run_number }}）"
            echo ""
            echo "**手机 Safari 打开下面的链接安装**（须先把设备 UDID 注册进 Devices）："
            echo ""
            echo "itms-services://?action=download-manifest&url=${BASE}manifest.plist"
            echo ""
            echo "> 注意：GitHub Pages 首次启用后需等约 1 分钟才可访问；"
            echo "> 安装后第一次打开若被拦，去 设置 → 通用 → VPN 与设备管理 信任证书。"
          } >> "$GITHUB_STEP_SUMMARY"
