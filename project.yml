# XcodeGen 工程定义
# 说明：本文件是工程的唯一真实来源，.xcodeproj 由 CI 生成，不纳入版本控制。
# 在 Windows 上只需编辑本文件，无需（也无法）触碰 .xcodeproj。
# 本地生成命令（如有 Mac）：brew install xcodegen && xcodegen generate

name: FloatingTicker

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:

  # ---- 主 App ----
  FloatingTicker:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      # 实时活动（Live Activity）的 UI 必须住在 Widget Extension 里，故需此独立 target。
      # embed: true 会把 .appex 打进 App 的 PlugIns 目录。
      - target: FloatingTickerWidget
        embed: true
    settings:
      base:
        PRODUCT_NAME: FloatingTicker
        # 免费 Apple ID 无法注册已被占用的 Bundle ID，此处保持唯一即可（可按需修改）
        PRODUCT_BUNDLE_IDENTIFIER: com.xfish.floatingticker
        # 付费开发者账号的 Team ID（Ad Hoc / 自动签名必需）。
        # 注意：这是账号专属信息，若更换开发者账号需同步修改。
        DEVELOPMENT_TEAM: "S2GX2R7LD5"
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        # App 图标：只需一张 1024×1024（Sources/Assets.xcassets/AppIcon.appiconset）。
        # 尺寸由系统按需缩放，无需再铺 20/29/40/60/76/83.5 等一堆规格。
        # 注意：图标**不能带 Alpha 通道**（iOS 不接受透明图标），
        # 故 AppIcon-1024.png 已用 -pix_fmt rgb24 输出为纯 RGB。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Push Notifications 能力（APNs 推送更新实时活动锁屏显示所需）
        CODE_SIGN_ENTITLEMENTS: Support/FloatingTicker.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"

  # ---- 实时活动 Widget 扩展 ----
  # 注意：这是一个**独立 bundle**，需要自己的 provisioning profile（各自签名）。
  FloatingTickerWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      # 与主 App 共享数据模型 —— 两端都要能编译这个文件
      - path: Sources/LiveActivity/TickerActivityAttributes.swift
    settings:
      base:
        PRODUCT_NAME: FloatingTickerWidget
        # 必须为主 App bundle id 的「前缀 + .后缀」形式，
        # 系统据此认定扩展属于哪个 App（写错会导致安装/识别失败）。
        PRODUCT_BUNDLE_IDENTIFIER: com.xfish.floatingticker.widget
        DEVELOPMENT_TEAM: "S2GX2R7LD5"
        INFOPLIST_FILE: Widget/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        # 扩展不单独安装，随主 App 一起打包
        SKIP_INSTALL: "YES"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"

# 必须显式声明 scheme，否则 CI 中的 xcodebuild -scheme 找不到共享 scheme
schemes:
  FloatingTicker:
    build:
      targets:
        FloatingTicker: all
    run:
      config: Debug
    archive:
      config: Release
