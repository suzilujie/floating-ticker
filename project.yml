# XcodeGen 工程定义
# 说明：本文件是工程的唯一真实来源，.xcodeproj 由 CI 生成，不纳入版本控制。
# 在 Windows 上只需编辑本文件，无需（也无法）触碰 .xcodeproj。
# 本地生成命令（如有 Mac）：brew install xcodegen && xcodegen generate

name: FloatingTicker

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  FloatingTicker:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: FloatingTicker
        # 免费 Apple ID 无法注册已被占用的 Bundle ID，此处保持唯一即可（可按需修改）
        PRODUCT_BUNDLE_IDENTIFIER: com.xfish.floatingticker
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"

# 必须显式声明 scheme，否则 CI 中的 xcodebuild -scheme 找不到共享 scheme
schemes:
  FloatingTicker:
    build:
      targets:
        FloatingTicker: all
    run:
      config: Debug
    archive:
      config: Release
